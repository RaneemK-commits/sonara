<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonara</title>
<link rel="stylesheet" href="/static/shared/base.css">
<style>
  body { min-height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto 1fr;
    padding: clamp(16px, 3vw, 32px) clamp(16px, 4vw, 48px); --accent: var(--sand); --wash: var(--sand-wash); }
  body[data-view="listening"] { --accent: var(--lavender); --wash: var(--lavender-wash); }
  body[data-view="confirm"]   { --accent: var(--lilac); --wash: var(--lilac-wash); }
  body[data-view="notified"], body[data-view="acked"] { --accent: var(--green); --wash: var(--green-wash); }
  body[data-view="failed"], body[data-view="offline"] { --accent: #E9B4C2; --wash: var(--rose-wash); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: clamp(20px, 2.2vw, 28px);
    position: relative; z-index: 1; }
  .floor { position: fixed; inset: auto 0 0 0; height: 26vh; pointer-events: none; transition: fill .4s ease; }

  main { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    gap: clamp(10px, 2vh, 20px); position: relative; z-index: 1; padding-bottom: 6vh; transition: opacity .2s ease; }
  main.swap { opacity: 0; }
  [hidden] { display: none !important; }
  h1 { margin: 0; font-size: clamp(40px, 4.6vw, 56px); font-weight: 800; line-height: 1.07; letter-spacing: -.02em;
    max-width: 20ch; text-wrap: balance; }
  .sub { margin: 0; font-size: clamp(18px, 2vw, 24px); color: var(--ink-2); font-weight: 450; max-width: 36ch; }
  .small { margin: 0; font-size: clamp(22px, 2.4vw, 30px); color: var(--ink-2); }
  .hint { margin: 0; font-size: clamp(16px, 1.7vw, 20px); color: var(--ink-2); }

  /* focal row: one visual + the Sonara bot as companion */
  .focal { display: flex; align-items: center; justify-content: center; gap: clamp(16px, 3vw, 40px); min-height: clamp(120px, 22vh, 200px); }
  .mic { width: clamp(110px, 15vw, 170px); aspect-ratio: 1; border-radius: 50%; background: var(--ink); color: #fff;
    display: grid; place-items: center; font-size: clamp(44px, 6vw, 68px); box-shadow: 0 0 0 clamp(14px, 2vw, 22px) var(--sand); }
  .wave { display: flex; align-items: center; gap: clamp(5px, .8vw, 10px); height: clamp(100px, 16vh, 150px); }
  .wave i { display: block; width: clamp(8px, 1vw, 12px); border-radius: 99px; background: var(--lavender);
    height: var(--h); animation: bar 1.1s ease-in-out infinite; animation-delay: var(--d); transform-origin: center; }
  .wave i:nth-child(odd) { background: #A97BF0; }
  @keyframes bar { 50% { transform: scaleY(.55); } }
  .check { width: clamp(90px, 11vw, 120px); aspect-ratio: 1; border-radius: 50%; background: var(--green); color: #fff;
    display: grid; place-items: center; font-size: clamp(48px, 6vw, 66px); }
  .check .ico { stroke-width: 3; }
  .alert { width: clamp(90px, 11vw, 120px); aspect-ratio: 1; border-radius: 50%; background: var(--rose-wash); color: var(--rose-ink);
    display: grid; place-items: center; font-size: clamp(48px, 6vw, 66px); }

  .card { display: flex; align-items: center; gap: .6em; padding: .35em .9em; min-width: min(80vw, 560px); justify-content: center;
    background: var(--lilac-wash); border-radius: var(--radius-card); font-size: clamp(36px, 4.4vw, 52px); font-weight: 800; letter-spacing: -.015em; }
  .card .ico { font-size: 1.1em; stroke-width: 1.6; }
  .card .sep { width: 1px; align-self: stretch; margin: .15em 0; background: var(--lilac); }

  .controls { display: flex; gap: 16px; margin-top: 8px; }
  .controls button { display: inline-flex; align-items: center; gap: .5em; min-height: 56px; padding: 0 1.4em; font-size: 20px; font-weight: 600;
    border-radius: var(--radius-control); border: 1.5px solid var(--line); background: var(--surface); }
  .controls .yes { background: var(--ink); border-color: var(--ink); color: #fff; min-width: 9em; justify-content: center; }

  /* Sonara bot: original cream orb, mode-driven, transforms/opacity only */
  .bot { width: clamp(104px, 12vw, 150px); aspect-ratio: 1; flex: none; }
  .bot svg { width: 100%; height: 100%; overflow: visible; }
  .bot .float { animation: float 5s ease-in-out infinite; }
  .bot .orb { transform-origin: 60px 64px; animation: breathe 4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-4px); } }
  @keyframes breathe { 50% { transform: scale(1.03); } }
  .bot .halo { opacity: .45; }
  .bot .open, .bot .smile, .bot .closed, .bot .mouth { transition: opacity .2s ease; }
  .bot .smile, .bot .closed, .bot .mouth, .bot .lines { opacity: 0; }
  .bot[data-mode="listening"] .open { opacity: 0; } .bot[data-mode="listening"] .closed { opacity: 1; }
  .bot[data-mode="listening"] .halo { animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: .75; } }
  .bot[data-mode="speaking"] .smile { opacity: 0; } .bot[data-mode="speaking"] .mouth { opacity: 1; animation: talk .5s ease-in-out infinite; transform-origin: 60px 78px; }
  .bot[data-mode="speaking"] .lines { opacity: 1; }
  @keyframes talk { 50% { transform: scaleY(.4); } }
  .bot[data-mode="success"] .open { opacity: 0; } .bot[data-mode="success"] .smile { opacity: 1; }
  .bot[data-mode="idle"] .smile { opacity: 0; }
  .bot[data-mode="error"] .float, .bot[data-mode="error"] .orb { animation: none; }

  body.paused * { animation-play-state: paused !important; }
  .demo { position: fixed; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end;
    max-width: 60vw; z-index: 2; font-size: 14px; }
  .demo button { padding: .55em .9em; min-height: 44px; border-radius: var(--radius-control); background: var(--surface);
    border: 1px solid var(--line); font-weight: 600; }
  .demo .tag { width: 100%; text-align: right; color: var(--ink-2); }
</style>
</head>
<body data-view="ready">
<svg hidden>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.8 16a4.8 4.8 0 0 1 6.4 0"/><circle cx="12" cy="19.3" r=".6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 7v6M12 16.5v.5"/></symbol>
  <symbol id="i-WATER" viewBox="0 0 24 24"><path d="M5 3h14l-1.6 17.2a1 1 0 0 1-1 .8H7.6a1 1 0 0 1-1-.8zM6 9h12"/></symbol>
  <symbol id="i-FOOD" viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 0-3.5 2.5-3.5 6S15 13 17 13"/></symbol>
  <symbol id="i-BATHROOM" viewBox="0 0 24 24"><path d="M4 12h16v2a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6zM6 12V5a2 2 0 0 1 4 0M8 20l-1 2M16 20l1 2"/></symbol>
  <symbol id="i-PAIN" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
  <symbol id="i-HELP" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0v4l-2 3h16l-2-3zM10 19a2 2 0 0 0 4 0"/></symbol>
</svg>

<header>
  <span class="logo"><img src="/static/shared/logo.svg" alt="">Sonara</span>
  <span class="conn" id="conn"><svg class="ico"><use href="#i-wifi"/></svg><span id="connText">Connecting…</span></span>
</header>

<svg class="floor" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 70 L600 150 L1200 40 L1200 200 L0 200 Z"/>
</svg>

<main id="main" aria-live="polite">
  <p class="small" id="small" hidden></p>
  <h1 id="head">What do you need?</h1>
  <p class="sub" id="sub">Just speak, and I’ll let your nurse know.</p>
  <div class="card" id="card" hidden></div>
  <p class="hint" id="hint" hidden>Say “yes” to confirm, or “no” to try again.</p>
  <div class="focal">
    <div class="mic" id="v-mic"><svg class="ico"><use href="#i-mic"/></svg></div>
    <div class="wave" id="v-wave" hidden></div>
    <div class="check" id="v-check" hidden><svg class="ico"><use href="#i-check"/></svg></div>
    <div class="alert" id="v-alert" hidden><svg class="ico" style="stroke-width:3"><use href="#i-alert"/></svg></div>
    <div class="bot" id="bot" data-mode="idle" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <defs><radialGradient id="cream" cx="40%" cy="32%" r="75%">
          <stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#FBF6EC"/><stop offset="1" stop-color="#EADFCB"/></radialGradient></defs>
        <circle class="halo" cx="60" cy="64" r="56"/>
        <g class="float"><g class="orb">
          <path d="M60 18c26 0 42 20 42 46 0 22-17 36-42 36S18 86 18 64c0-26 16-46 42-46z" fill="url(#cream)" stroke="#D8D2CA" stroke-width="1.2"/>
          <g class="open" fill="#171717"><rect x="45" y="54" width="7" height="13" rx="3.5"/><rect x="68" y="54" width="7" height="13" rx="3.5"/></g>
          <g class="closed smile" stroke="#171717" stroke-width="3.5" fill="none" stroke-linecap="round"><path d="M43 61q5-6 10 0M67 61q5-6 10 0"/></g>
          <path class="smile" d="M52 76q8 7 16 0" stroke="#171717" stroke-width="3" fill="none" stroke-linecap="round"/>
          <ellipse class="mouth" cx="60" cy="78" rx="5" ry="4" fill="#171717"/>
        </g>
        <g class="lines" stroke="#A97BF0" stroke-width="3" stroke-linecap="round"><path d="M108 52v20M115 57v10"/></g></g>
      </svg>
    </div>
  </div>
  <div class="controls" id="controls" hidden>
    <button data-a="retry"><svg class="ico"><use href="#i-retry"/></svg>Try again</button>
    <button data-a="cancel"><svg class="ico"><use href="#i-x"/></svg>No</button>
    <button class="yes" data-a="confirm"><svg class="ico"><use href="#i-check"/></svg>Yes</button>
  </div>
</main>

<section class="demo" id="demo" hidden aria-label="Demo controls">
  <span class="tag">Demo controls (simulated input)</span>
  <button data-a="talk">Talk</button>
</section>

<script>
const $ = id => document.getElementById(id);
const post = (action, intent) => fetch("/api/room/input", { method: "POST",
  headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, intent }) });
const act = (a, i) => a === "retry" ? post("cancel").then(() => post("talk")) : post(a, i);

const wave = $("v-wave");
[18, 28, 40, 55, 72, 92, 120, 92, 72, 55, 40, 28, 18].forEach((h, k) =>
  wave.insertAdjacentHTML("beforeend", `<i style="--h:${h}px;--d:${(k % 5) * -.18}s"></i>`));

// Demo panel: hidden by default, ?demo or "D" key toggles it
const demo = $("demo");
demo.hidden = !new URLSearchParams(location.search).has("demo");
addEventListener("keydown", e => { if (e.key === "d" || e.key === "D") demo.hidden = !demo.hidden; });
document.addEventListener("click", e => { const b = e.target.closest("button[data-a]"); if (b) act(b.dataset.a, b.dataset.i); });
let demoBuilt = false;

// view: [visual, bot mode, small, headline, sub, card?, hint?, controls?]
const VIEW = {
  ready:      ["mic",   "idle",      "", "What do you need?", "Just speak, and I’ll let your nurse know."],
  listening:  ["wave",  "listening", "", "I’m listening…", "Tell me what you need."],
  processing: ["wave",  "listening", "", "One moment…", ""],
  confirm:    ["",      "speaking",  "Did you mean…", "", "", 1, 1, 1],
  retry:      ["mic",   "idle",      "", "I didn’t understand.", "Please try again."],
  sending:    ["",      "idle",      "", "Sending to your nurse…", ""],
  notified:   ["check", "success",   "", "Your nurse has been notified.", ""],
  acked:      ["check", "success",   "", "Your nurse acknowledged your request.", ""],
  cancelled:  ["",      "idle",      "", "Okay, not sent.", ""],
  failed:     ["alert", "error",     "", "Unable to notify your nurse.", "Use the existing nurse-call system."],
  offline:    ["alert", "error",     "", "Not connected.", "Requests can’t be sent right now. Use the existing nurse-call system."],
};
const RECENT_MS = 60000;   // how long a delivered/cancelled status stays before returning to Ready
let current = "", retryUntil = 0, lastKey = "", last = null;

function pick(s) {
  if (!s) return "offline";
  if (s.state === "LISTENING") return "listening";
  if (s.state === "PROCESSING") return "processing";
  if (s.state === "AWAIT_CONFIRM") return "confirm";
  if (Date.now() < retryUntil) return "retry";
  const r = s.request, fresh = r && Date.now() - Date.parse(r.updated_at) < RECENT_MS;
  if (r && r.status === "NOT_DISPLAYED") return "failed";          // never auto-hide a failed delivery
  if (r && r.status === "QUEUED") return "sending";
  if (fresh && r.status === "DISPLAYED") return "notified";        // only after the caregiver screen's receipt
  if (fresh && r.status === "ACKNOWLEDGED") return "acked";
  if (fresh && r.status === "CANCELLED") return "cancelled";
  return "ready";
}

function show(key, s) {
  const it = s && s.last && (s.intents || []).find(i => i.id === s.last.intent);
  const label = it ? it.label : (s && s.last && s.last.text || "").replace(/[.!?]+$/, "");
  const sig = key + label;
  if (sig === current) return;
  const [vis, mode, small, head, sub, card, hint, controls] = VIEW[key];
  const apply = () => {
    document.body.dataset.view = key;
    // SVG fills don't reliably repaint on custom-property changes, so set them directly
    const cs = getComputedStyle(document.body);
    document.querySelector(".floor path").setAttribute("fill", cs.getPropertyValue("--wash").trim());
    document.querySelector(".bot .halo").setAttribute("fill", cs.getPropertyValue("--accent").trim());
    for (const v of ["mic", "wave", "check", "alert"]) $("v-" + v).hidden = vis !== v;
    $("bot").dataset.mode = mode;
    $("small").textContent = small; $("small").hidden = !small;
    $("head").textContent = head; $("head").hidden = !head;
    $("sub").textContent = sub; $("sub").hidden = !sub;
    $("card").hidden = !card; $("hint").hidden = !hint; $("controls").hidden = !controls;
    if (card) {
      const icon = it && document.getElementById("i-" + it.id) ? `<svg class="ico"><use href="#i-${it.id}"/></svg><span class="sep"></span>` : "";
      $("card").innerHTML = `${icon}<span></span>`; $("card").lastChild.textContent = label + "?";
    }
  };
  if (current) { $("main").classList.add("swap"); setTimeout(() => { apply(); $("main").classList.remove("swap"); }, 200); } else apply();
  current = sig;
}

function render(s) {
  last = s;
  const key = s.last && s.last.understood === false ? JSON.stringify(s.last) : "";
  if (key && key !== lastKey && s.state === "IDLE") retryUntil = Date.now() + 5000;   // fresh rejection
  lastKey = key;
  if (!demoBuilt && s.intents) {
    demoBuilt = true;
    for (const i of s.intents) { const b = document.createElement("button");
      b.textContent = i.label; b.dataset.a = "select"; b.dataset.i = i.id; demo.append(b); }
  }
  show(pick(s), s);
}
setInterval(() => last && show(pick(last), last), 1000);   // let timed views expire

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?role=room`);
  ws.onopen = () => { $("connText").textContent = "Connected"; $("conn").classList.add("on"); };
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === "room_state") render(m); };
  ws.onclose = () => { $("connText").textContent = "Disconnected"; $("conn").classList.remove("on");
    last = null; show("offline"); setTimeout(connect, 1500); };
}
connect();
document.addEventListener("visibilitychange", () =>
  document.body.classList.toggle("paused", document.hidden));
</script>
</body>
</html>
