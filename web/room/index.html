<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonara</title>
<link rel="preload" href="/static/shared/fonts/Inter.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/static/shared/base.css">
<script src="/static/shared/orb.js"></script>
<style>
  /* Sized in mockup pixels: the v2 mockup panel is 690 x 478, so 1 mock px = --px at any screen size. */
  :root { --px: min(calc(100vw / 690), calc(100vh / 478)); }
  html, body { height: 100%; overflow: hidden; background: var(--canvas); }
  body { display: grid; place-items: center; --wash: var(--sand-wash); }
  body[data-view="listening"] { --wash: var(--lavender-wash); }   /* processing keeps the sand wash: the orb thinks in peach */
  body[data-view="confirm"] { --wash: var(--lilac-wash); }
  body[data-view="notified"], body[data-view="acked"] { --wash: var(--green-wash); }
  body[data-view="failed"], body[data-view="offline"] { --wash: var(--rose-wash); }

  /* full-bleed: fills the whole display (1024x600 on the board), no frame */
  .screen { position: fixed; inset: 0; overflow: hidden; background: var(--canvas); }
  .floor { position: absolute; inset: auto 0 0 0; height: max(calc(118 * var(--px)), 20vh); pointer-events: none;
    background: linear-gradient(to bottom, color-mix(in srgb, var(--wash) 0%, transparent), var(--wash) 70%);
    clip-path: polygon(0 0, 50% 62%, 100% 0, 100% 100%, 0 100%); transition: background .3s ease; }

  header { position: absolute; top: calc(24 * var(--px)); left: calc(34 * var(--px)); right: calc(26 * var(--px));
    display: flex; align-items: center; justify-content: space-between; z-index: 1; }
  .logo { font-size: calc(29 * var(--px)); gap: calc(12 * var(--px)); }
  .logo .ico { width: calc(42 * var(--px)); height: calc(40 * var(--px)); stroke-width: 3.2; }
  .conn { font-size: calc(18 * var(--px)); padding: calc(9 * var(--px)) calc(17 * var(--px)); border-radius: calc(9 * var(--px)); gap: calc(10 * var(--px)); }
  .conn .ico { width: calc(23 * var(--px)); height: calc(23 * var(--px)); }

  /* every screen is laid out absolutely to mockup coordinates, so states never reflow each other */
  /* the content box keeps the mockup's 690 x 478 proportions, centred on any screen shape */
  .view { position: absolute; left: 50%; top: 50%; width: calc(690 * var(--px)); height: calc(478 * var(--px));
    transform: translate(-50%, -50%); display: none; }
  body[data-view="ready"] #v-ready, body[data-view="retry"] #v-ready, body[data-view="cancelled"] #v-ready,
  body[data-view="listening"] #v-listen, body[data-view="processing"] #v-listen,
  body[data-view="confirm"] #v-confirm,
  body[data-view="sending"] #v-done, body[data-view="notified"] #v-done, body[data-view="acked"] #v-done,
  body[data-view="failed"] #v-done, body[data-view="offline"] #v-done { display: block; animation: in .25s ease both; }
  @keyframes in { from { opacity: 0; } }

  .t { position: absolute; left: 0; right: 0; text-align: center; margin: 0; padding: 0 calc(24 * var(--px)); }
  h1.t { font-weight: 800; letter-spacing: -.028em; line-height: 1.05; }
  .gray { color: var(--ink-2); font-weight: 400; letter-spacing: -.01em; }

  /* ready */
  #v-ready h1 { top: calc(110 * var(--px)); font-size: calc(54 * var(--px)); }
  #v-ready .sub { top: calc(174 * var(--px)); font-size: calc(24.5 * var(--px)); }
  /* listening */
  #v-listen h1 { top: calc(270 * var(--px)); font-size: calc(56 * var(--px)); }
  #v-listen .sub { top: calc(337 * var(--px)); font-size: calc(26 * var(--px)); }

  /* confirm */
  #v-confirm .ask { top: calc(84 * var(--px)); font-size: calc(26 * var(--px)); }
  .card { position: absolute; left: calc(57 * var(--px)); right: calc(57 * var(--px)); top: calc(137 * var(--px)); height: calc(103 * var(--px));
    background: var(--lilac-wash); border-radius: calc(6 * var(--px)); display: flex; align-items: center; justify-content: center; }
  .card .ico { width: calc(54 * var(--px)); height: calc(54 * var(--px)); stroke-width: 1.6; }
  .card .sep { width: 1px; height: calc(58 * var(--px)); background: var(--lilac); margin: 0 calc(36 * var(--px)) 0 calc(42 * var(--px)); }
  .card .phrase { font-size: calc(50 * var(--px)); font-weight: 800; letter-spacing: -.035em; white-space: nowrap; }
  #v-confirm .hint { top: calc(258 * var(--px)); font-size: calc(22 * var(--px)); }
  .pill { position: absolute; left: 50%; top: calc(312 * var(--px)); transform: translateX(-50%); height: calc(42 * var(--px));
    padding: 0 calc(30 * var(--px)); border-radius: calc(8 * var(--px)); background: var(--lilac-wash); display: flex; align-items: center;
    gap: calc(14 * var(--px)); font-size: calc(20 * var(--px)); color: #333; white-space: nowrap; }
  .pill .ico { width: calc(28 * var(--px)); height: calc(28 * var(--px)); }
  .btns { position: absolute; left: calc(40 * var(--px)); right: calc(27 * var(--px)); top: calc(390 * var(--px));
    display: grid; grid-template-columns: 201fr 187fr 187fr; gap: calc(21 * var(--px)); }
  .btns button { height: calc(62 * var(--px)); border-radius: calc(4 * var(--px)); border: calc(1.6 * var(--px)) solid #8E8A86; background: var(--surface);
    display: flex; align-items: center; justify-content: center; gap: calc(14 * var(--px)); font-size: calc(22 * var(--px)); font-weight: 600; letter-spacing: -.01em; }
  .btns button .ico { width: calc(28 * var(--px)); height: calc(28 * var(--px)); stroke-width: 2.2; }
  .btns .yes { background: #161616; border-color: #161616; color: #fff; }

  /* sending / notified / acknowledged / failed / offline */
  #v-done h1 { top: calc(245 * var(--px)); font-size: calc(42 * var(--px)); }
  #v-done .sub { top: calc(306 * var(--px)); font-size: calc(24 * var(--px)); }
  body[data-view="failed"] #v-done h1, body[data-view="offline"] #v-done h1 { color: var(--rose-ink); }

  /* Sonara orb (web/shared/orb.js): one character for every view; glides to where the mockup's mic / wave / badge were */
  .orb { position: absolute; left: 50%; top: calc(50% + (var(--y) - 239) * var(--px)); width: calc(var(--s) * var(--px));
    aspect-ratio: 260 / 230; transform: translate(-50%, -50%); z-index: 1; --y: 332; --s: 303;
    /* orb colours follow each view's background wash */
    --orb-idle: #F0A868; --orb-thinking: #F0A868; --orb-speaking: #F0A868;
    --orb-listening: var(--violet); --orb-success: var(--green); --orb-error: #E0697B;
    transition: top .45s cubic-bezier(.3,.7,.2,1), width .45s cubic-bezier(.3,.7,.2,1), opacity .2s ease; }
  body[data-view="listening"] .orb, body[data-view="processing"] .orb { --y: 180; }
  body[data-view="sending"] .orb, body[data-view="notified"] .orb, body[data-view="acked"] .orb,
  body[data-view="failed"] .orb, body[data-view="offline"] .orb { --y: 176; --s: 195; }
  body[data-view="confirm"] .orb { opacity: 0; }

  body.paused * { animation-play-state: paused !important; }
  .demo { position: fixed; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 60vw; z-index: 3; font-size: 13px; }
  .demo button { padding: 6px 10px; min-height: 36px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; }
  .demo span { width: 100%; text-align: right; color: var(--ink-2); }
</style>
</head>
<body data-view="ready">
<svg hidden aria-hidden="true">
  <symbol id="i-mark" viewBox="0 0 42 40"><path d="M3 15v10M11 10v20M19 4v32M27 9v22M35 14v12"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9.5a14 14 0 0 1 19 0M5.8 13a9.3 9.3 0 0 1 12.4 0M9 16.4a4.6 4.6 0 0 1 6 0"/><circle cx="12" cy="19.6" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18M9 16.4a4.6 4.6 0 0 1 6 0M5.8 13a9.3 9.3 0 0 1 4-2.2M14.6 10.9a9.3 9.3 0 0 1 3.6 2.1"/><circle cx="12" cy="19.6" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M8.5 21.5h7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2L18.5 7.8"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4.6h-4.6"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 6.5v7M12 17.5v.01"/></symbol>
  <symbol id="i-WATER" viewBox="0 0 24 24"><path d="M4.5 3h15l-1.7 17.3a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9zM5.6 10.5h12.8"/></symbol>
  <symbol id="i-FOOD" viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 0-3.5 2.5-3.5 6S15 13 17 13"/></symbol>
  <symbol id="i-BATHROOM" viewBox="0 0 24 24"><path d="M4 12h16v2a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6zM6 12V5a2 2 0 0 1 4 0M8 20l-1 2M16 20l1 2"/></symbol>
  <symbol id="i-PAIN" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
  <symbol id="i-HELP" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0v4l-2 3h16l-2-3zM10 19a2 2 0 0 0 4 0"/></symbol>
</svg>

<div class="screen">
  <div class="floor" aria-hidden="true"></div>
  <header>
    <span class="logo"><svg class="ico"><use href="#i-mark"/></svg>Sonara</span>
    <span class="conn" id="conn"><svg class="ico"><use href="#i-wifi-off" id="connIco"/></svg><span id="connText">Connecting</span></span>
  </header>

  <sonara-orb class="orb" id="orb" mode="idle" aria-hidden="true"></sonara-orb>

  <section class="view" id="v-ready" aria-live="polite">
    <h1 class="t" id="readyHead">What do you need?</h1>
    <p class="t gray sub" id="readySub">Just speak, and I’ll let your nurse know.</p>
  </section>

  <section class="view" id="v-listen" aria-live="polite">
    <h1 class="t" id="listenHead">I’m listening…</h1>
    <p class="t gray sub" id="listenSub">Tell me what you need.</p>
  </section>

  <section class="view" id="v-confirm" aria-live="polite">
    <p class="t gray ask">Did you mean…</p>
    <div class="card"><span id="cardIcon"></span><span class="sep" id="cardSep"></span><span class="phrase" id="phrase"></span></div>
    <p class="t gray hint">Say “yes” to confirm, or “no” to try again.</p>
    <div class="pill" id="pill"><svg class="ico"><use href="#i-speaker"/></svg>Playing aloud…</div>
    <div class="btns">
      <button data-a="retry"><svg class="ico"><use href="#i-retry"/></svg>Try again</button>
      <button data-a="cancel"><svg class="ico"><use href="#i-x"/></svg>No</button>
      <button class="yes" data-a="confirm"><svg class="ico"><use href="#i-check"/></svg>Yes</button>
    </div>
  </section>

  <section class="view" id="v-done" aria-live="polite">
    <h1 class="t" id="doneHead"></h1>
    <p class="t gray sub" id="doneSub"></p>
  </section>
</div>

<section class="demo" id="demo" hidden aria-label="Demo controls">
  <span>Demo controls (simulated input)</span>
  <button data-a="talk">Talk</button>
  <span>Orb preview (screen only, nothing is sent)</span>
  <button data-p="ready">Idle</button><button data-p="listening">Listening</button><button data-p="processing">Thinking</button>
  <button data-p="notified">Success</button><button data-p="failed">Failure</button><button data-p="">Live</button>
</section>

<script>
const $ = id => document.getElementById(id);
const post = (action, intent) => fetch("/api/room/input", { method: "POST",
  headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, intent }) });
const act = (a, i) => a === "retry" ? post("cancel").then(() => post("talk")) : post(a, i);
document.addEventListener("click", e => { const b = e.target.closest("button[data-a]"); if (b) act(b.dataset.a, b.dataset.i); });

// what the patient sees on the confirm card, in their words (ui owns these texts)
const PHRASE = { WATER: "I need water?", HELP: "I need help?", FOOD: "I’m hungry?", PAIN: "I’m in pain?", BATHROOM: "I need the bathroom?" };

const demo = $("demo");
demo.hidden = !new URLSearchParams(location.search).has("demo");
addEventListener("keydown", e => { if (e.key === "d" || e.key === "D") demo.hidden = !demo.hidden; });
let demoBuilt = false;

// done-view texts: [orb mode, headline, subline]. Never "they'll be with you soon": nobody has promised that.
const DONE = {
  sending:  ["thinking", "Sending to your nurse…", ""],
  notified: ["success", "Your nurse has been notified.", ""],
  acked:    ["success", "Your nurse acknowledged your request.", ""],
  failed:   ["error", "Unable to notify your nurse.", "Use the existing nurse-call system."],
  offline:  ["error", "Not connected.", "Use the existing nurse-call system."],
};
const RECENT_MS = 60000, PILL_MS = 4000;
let current = "", retryUntil = 0, lastKey = "", last = null, confirmSince = 0;

let preview = "";   // demo-only: force a view to check the orb; "" = follow the device
document.addEventListener("click", e => { const b = e.target.closest("button[data-p]");
  if (b) { preview = b.dataset.p; show(pick(last), last); } });

function pick(s) {
  if (preview) return preview;
  if (!s) return "offline";
  if (s.state === "LISTENING") return "listening";
  if (s.state === "PROCESSING") return "processing";
  if (s.state === "AWAIT_CONFIRM") return "confirm";
  if (Date.now() < retryUntil) return "retry";
  const r = s.request, fresh = r && Date.now() - Date.parse(r.updated_at) < RECENT_MS;
  if (r && r.status === "NOT_DISPLAYED") return "failed";       // never auto-hidden
  if (r && r.status === "QUEUED") return "sending";
  if (fresh && r.status === "DISPLAYED") return "notified";     // only after the nurse screen's receipt
  if (fresh && r.status === "ACKNOWLEDGED") return "acked";
  if (fresh && r.status === "CANCELLED") return "cancelled";
  return "ready";
}

function show(key, s) {
  const it = s && s.last && (s.intents || []).find(i => i.id === s.last.intent);
  const sig = key + (it ? it.id : "");
  if (key === "confirm") $("pill").hidden = Date.now() - confirmSince > PILL_MS;
  if (sig === current) return;
  if (key === "confirm") { confirmSince = Date.now(); $("pill").hidden = false; }
  current = sig;
  document.body.dataset.view = key;
  $("orb").setAttribute("mode", DONE[key] ? DONE[key][0] : key === "listening" ? "listening" : key === "processing" ? "thinking" : "idle");
  $("readyHead").textContent = key === "retry" ? "I didn’t understand." : key === "cancelled" ? "Okay, not sent." : "What do you need?";
  $("readySub").textContent = key === "retry" ? "Please try again." : key === "cancelled" ? "Say something whenever you’re ready." : "Just speak, and I’ll let your nurse know.";
  $("listenHead").textContent = key === "processing" ? "One moment…" : "I’m listening…";
  $("listenSub").textContent = key === "processing" ? "Working out what you said." : "Tell me what you need.";
  if (key === "confirm") {
    const id = it && it.id, has = id && document.getElementById("i-" + id);
    $("cardIcon").innerHTML = has ? `<svg class="ico"><use href="#i-${id}"/></svg>` : "";
    $("cardSep").hidden = !has;
    $("phrase").textContent = PHRASE[id] || ((it ? it.label : (s.last.text || "").replace(/[.!?]+$/, "")) + "?");
    fitPhrase();
  }
  if (DONE[key]) {
    const [, head, sub] = DONE[key];
    $("doneHead").textContent = head; $("doneSub").textContent = sub;
  }
}

// shrink a long phrase until it fits inside the card (mockup size is the maximum)
function fitPhrase() {
  const card = document.querySelector(".card"), ph = $("phrase");
  ph.style.fontSize = "";
  const edge = () => card.getBoundingClientRect().right - card.clientWidth * 0.05;
  let size = parseFloat(getComputedStyle(ph).fontSize);
  while (ph.getBoundingClientRect().right > edge() && size > 12) { size -= 1; ph.style.fontSize = size + "px"; }
}
addEventListener("resize", fitPhrase);

function render(s) {
  last = s;
  const k = s.last && s.last.understood === false ? JSON.stringify(s.last) : "";
  if (k && k !== lastKey && s.state === "IDLE") retryUntil = Date.now() + 5000;   // fresh rejection
  lastKey = k;
  if (!demoBuilt && s.intents) {
    demoBuilt = true;
    for (const i of s.intents) { const b = document.createElement("button");
      b.textContent = i.label; b.dataset.a = "select"; b.dataset.i = i.id; demo.append(b); }
  }
  show(pick(s), s);
}
// shortcut: "Playing aloud…" shows for the first 4 s of confirm; upgrade when device sends TTS start/end events
setInterval(() => last && show(pick(last), last), 500);

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?role=room`);
  ws.onopen = () => { $("conn").classList.add("on"); $("connText").textContent = "Connected"; $("connIco").setAttribute("href", "#i-wifi"); };
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === "room_state") render(m); };
  ws.onclose = () => { $("conn").classList.remove("on"); $("connText").textContent = "Disconnected"; $("connIco").setAttribute("href", "#i-wifi-off");
    last = null; show("offline"); setTimeout(connect, 1500); };
}
connect();
document.addEventListener("visibilitychange", () => document.body.classList.toggle("paused", document.hidden));
</script>
</body>
</html>
