<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonara Room</title>
<link rel="stylesheet" href="/static/shared/base.css">
<style>
  body { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto auto; gap: 20px;
         padding: 24px clamp(16px, 4vw, 48px); font-size: clamp(18px, 2.2vw, 26px); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .bed { font-weight: 800; letter-spacing: .02em; }
  .state { font-size: .9em; }
  main { display: grid; align-content: center; gap: 24px; text-align: center; }
  .phrase { font-size: clamp(40px, 7vw, 96px); font-weight: 800; line-height: 1.1; margin: 0;
            text-wrap: balance; min-height: 1.2em; }
  .phrase.muted { color: var(--muted); font-weight: 600; font-size: clamp(28px, 4vw, 56px); }
  .ask { font-size: 1.1em; color: var(--muted); min-height: 1.4em; margin: 0; }
  .status { justify-self: center; display: flex; align-items: center; gap: .6em; padding: .7em 1.2em;
            border-radius: var(--radius); background: var(--surface); border: 2px solid var(--line);
            font-weight: 700; max-width: 900px; }
  .status .icon { font-size: 1.4em; width: 1.4em; text-align: center; }
  .status.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
  .status.warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
  .status[hidden] { display: none; }
  .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .controls button { padding: 1em .5em; border-radius: var(--radius); font-size: 1.2em; font-weight: 800;
                     background: var(--surface); color: var(--ink); border: 3px solid var(--line); }
  .controls .talk { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .controls .talk.live { animation: pulse 1.2s ease-in-out infinite; }
  .controls .confirm:not(:disabled) { border-color: var(--ok); color: var(--ok); }
  .controls button:disabled { opacity: .4; cursor: default; }
  @keyframes pulse { 50% { transform: scale(.97); filter: brightness(1.15); } }
  @media (prefers-reduced-motion: reduce) { .controls .talk.live { animation: none; outline: 6px solid var(--ok); } }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .tiles span { width: 100%; text-align: center; color: var(--muted); font-size: .75em; }
  .tiles button { padding: .5em 1em; border-radius: 999px; background: var(--surface);
                  border: 2px solid var(--line); color: var(--ink); font-size: .85em; font-weight: 600; }
</style>
</head>
<body>
<header>
  <span class="bed" id="bed">—</span>
  <span class="badge state" id="state">Connecting…</span>
  <span class="conn" id="conn">Offline</span>
</header>

<main aria-live="polite">
  <p class="phrase muted" id="phrase">Press Talk and speak</p>
  <p class="ask" id="ask"></p>
  <div class="status" id="status" hidden><span class="icon" id="sicon"></span><span id="stext"></span></div>
</main>

<section class="controls">
  <button class="talk" id="talk">🎙 Talk</button>
  <button class="confirm" id="confirm" disabled>✔ Send</button>
  <button class="cancel" id="cancel">✖ Cancel</button>
</section>

<section class="tiles" id="tiles" aria-label="Choose a phrase manually"></section>

<script>
const $ = id => document.getElementById(id);
const STATE = { IDLE: ["Ready", ""], LISTENING: ["Listening…", "ok"], PROCESSING: ["Understanding…", ""],
                AWAIT_CONFIRM: ["Send to caregiver?", "warn"] };
// icon + text so status never relies on colour alone
const REQ = {
  QUEUED:        ["⏳", "Saved. Waiting for the caregiver screen…", ""],
  DISPLAYED:     ["🖥", "Shown on the caregiver's screen. Not yet acknowledged.", ""],
  NOT_DISPLAYED: ["⚠", "Not reached a caregiver yet. Use your call button if you need help now.", "warn"],
  ACKNOWLEDGED:  ["✔", "A caregiver acknowledged your request.", "ok"],
  COMPLETED:     ["✔", "Request completed.", "ok"],
  CANCELLED:     ["✖", "Request cancelled.", ""],
};
const post = (action, intent) => fetch("/api/room/input", { method: "POST",
  headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, intent }) });
$("talk").onclick = () => post("talk");
$("confirm").onclick = () => post("confirm");
$("cancel").onclick = () => post("cancel");

let tilesBuilt = false;
function render(s) {
  $("bed").textContent = s.bed_id;
  const [label, tone] = STATE[s.state] || [s.state, ""];
  $("state").textContent = label; $("state").className = "badge state " + tone;
  $("talk").classList.toggle("live", s.state === "LISTENING");
  $("talk").disabled = !s.has_mic;
  $("confirm").disabled = s.state !== "AWAIT_CONFIRM";
  const p = $("phrase");
  if (s.last.understood === false) { p.textContent = "Sorry, I didn't understand. Please try again."; p.className = "phrase muted"; }
  else if (s.last.text) { p.textContent = s.last.text; p.className = "phrase"; }
  $("ask").textContent = s.state === "AWAIT_CONFIRM" ? "Send this to your caregiver? Press Send, or say yes." : "";
  const r = s.request;
  if (r && REQ[r.status]) {
    const [icon, text, cls] = REQ[r.status];
    $("status").hidden = false; $("status").className = "status " + cls;
    $("sicon").textContent = icon; $("stext").textContent = `${r.label}: ${text}`;
  } else $("status").hidden = true;
  if (!tilesBuilt) {
    tilesBuilt = true;
    $("tiles").innerHTML = "<span>Or tap a phrase</span>";
    for (const i of s.intents) {
      const b = document.createElement("button"); b.textContent = i.label;
      b.onclick = () => post("select", i.id); $("tiles").append(b);
    }
  }
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?role=room`);
  ws.onopen = () => { $("conn").textContent = "Device online"; $("conn").classList.add("on"); };
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === "room_state") render(m); };
  ws.onclose = () => { $("conn").textContent = "Device offline"; $("conn").classList.remove("on");
                       $("state").textContent = "Reconnecting…"; setTimeout(connect, 1500); };
}
connect();
</script>
</body>
</html>
