<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonara</title>
<meta name="description" content="Sonara, an offline bedside speech assistant.">
<link rel="preload" href="/static/shared/fonts/AtkinsonHyperlegible-Bold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/static/room/room.css">
</head>
<body>
<svg hidden aria-hidden="true">
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M3 10v4M7.5 7v10M12 4v16M16.5 7v10M21 10v4"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.8 16a4.8 4.8 0 0 1 6.4 0M12 19.5v.01"/></symbol>
  <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18M8.8 16a4.8 4.8 0 0 1 6.4 0M12 19.5v.01M5.5 12.5a9.5 9.5 0 0 1 4-2.3M14.5 10.3a9.5 9.5 0 0 1 4 2.2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 6v8M12 18v.01"/></symbol>
  <symbol id="i-WATER" viewBox="0 0 24 24"><path d="M5 3h14l-1.6 17.2a1 1 0 0 1-1 .8H7.6a1 1 0 0 1-1-.8zM6 9h12"/></symbol>
  <symbol id="i-FOOD" viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 0-3.5 2.5-3.5 6S15 13 17 13"/></symbol>
  <symbol id="i-BATHROOM" viewBox="0 0 24 24"><path d="M4 12h16v2a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6zM6 12V5a2 2 0 0 1 4 0M8 20l-1 2M16 20l1 2"/></symbol>
  <symbol id="i-PAIN" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
  <symbol id="i-HELP" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0v4l-2 3h16l-2-3zM10 19a2 2 0 0 0 4 0"/></symbol>
</svg>

<header class="bar">
  <span class="wordmark"><svg aria-hidden="true" class="ico"><use href="#i-mark"/></svg>Sonara</span>
  <span class="conn" id="conn" data-state="off"><svg aria-hidden="true" class="ico" id="connIco"><use href="#i-wifi-off"/></svg><span id="connText">Connecting</span></span>
</header>

<main class="stage" id="stage" aria-live="polite">
  <div class="face" id="face" data-mode="idle" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <circle class="shell" cx="50" cy="50" r="44"/>
      <g class="part eyes-open"><rect x="34" y="38" width="7" height="12" rx="3.5"/><rect x="59" y="38" width="7" height="12" rx="3.5"/></g>
      <path class="part eyes-up" d="M33 42q4-4 8 0M59 42q4-4 8 0"/>
      <path class="part eyes-happy" d="M32 45q5-6 10 0M58 45q5-6 10 0"/>
      <path class="part mouth-flat" d="M42 66h16"/>
      <circle class="part mouth-o" cx="50" cy="66" r="4"/>
      <path class="part mouth-talk" d="M43 64q7 8 14 0z"/>
      <path class="part mouth-smile" d="M39 62q11 11 22 0"/>
      <path class="part mouth-worry" d="M41 68q9-6 18 0"/>
    </svg>
  </div>
  <div class="meter" id="meter" hidden aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="badge badge-ok" id="ok" hidden><svg aria-hidden="true" class="ico"><use href="#i-check"/></svg></div>
  <div class="badge badge-bad" id="bad" hidden><svg aria-hidden="true" class="ico"><use href="#i-alert"/></svg></div>
  <p class="ask" id="ask" hidden>Did you mean…</p>
  <h1 class="head" id="head">What do you need?</h1>
  <p class="sub" id="sub">Just speak, and I’ll let your nurse know.</p>
  <div class="request" id="request" hidden></div>
  <p class="hint" id="hint" hidden>Say “yes” to confirm, or “no” to try again.</p>
  <div class="controls" id="controls" hidden>
    <button class="btn" type="button" data-a="retry"><svg aria-hidden="true" class="ico"><use href="#i-retry"/></svg>Try again</button>
    <button class="btn" type="button" data-a="cancel"><svg aria-hidden="true" class="ico"><use href="#i-x"/></svg>No</button>
    <button class="btn btn-primary" type="button" data-a="confirm"><svg aria-hidden="true" class="ico"><use href="#i-check"/></svg>Yes</button>
  </div>
</main>

<footer class="demo" id="demo" hidden aria-label="Demo controls">
  <span>Demo controls, simulated input</span>
  <button class="btn" type="button" data-a="talk">Talk</button>
</footer>

<script>
const $ = id => document.getElementById(id);
const post = (action, intent) => fetch("/api/room/input", { method: "POST",
  headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, intent }) });
const act = (a, i) => a === "retry" ? post("cancel").then(() => post("talk")) : post(a, i);
document.addEventListener("click", e => { const b = e.target.closest("button[data-a]"); if (b) act(b.dataset.a, b.dataset.i); });

const demo = $("demo");
demo.hidden = !new URLSearchParams(location.search).has("demo");
addEventListener("keydown", e => { if (e.key === "d" || e.key === "D") demo.hidden = !demo.hidden; });
let demoBuilt = false;

// view: face, visual (meter|ok|bad|""), ask?, head, sub, request?, controls?, tone
const V = {
  ready:      ["idle",      "",      0, "What do you need?", "Just speak, and I’ll let your nurse know."],
  listening:  ["listening", "meter", 0, "I’m listening…", "Tell me what you need."],
  processing: ["thinking",  "",      0, "One moment…", ""],
  confirm:    ["speaking",  "",      1, "", "", 1, 1],
  retry:      ["idle",      "",      0, "I didn’t understand.", "Please try again."],
  sending:    ["thinking",  "",      0, "Sending to your nurse…", ""],
  notified:   ["success",   "ok",    0, "Your nurse has been notified.", ""],
  acked:      ["success",   "ok",    0, "Your nurse has acknowledged your request.", ""],
  cancelled:  ["idle",      "",      0, "Okay, not sent.", ""],
  failed:     ["error",     "bad",   0, "Unable to notify your nurse.", "Use the existing nurse-call system.", 0, 0, "error"],
  offline:    ["error",     "bad",   0, "Not connected.", "Requests can’t be sent right now. Use the existing nurse-call system.", 0, 0, "error"],
};
const RECENT_MS = 60000;
let current = "", retryUntil = 0, lastKey = "", last = null;

function pick(s) {
  if (!s) return "offline";
  if (s.state === "LISTENING") return "listening";
  if (s.state === "PROCESSING") return "processing";
  if (s.state === "AWAIT_CONFIRM") return "confirm";
  if (Date.now() < retryUntil) return "retry";
  const r = s.request, fresh = r && Date.now() - Date.parse(r.updated_at) < RECENT_MS;
  if (r && r.status === "NOT_DISPLAYED") return "failed";       // never auto-hidden
  if (r && r.status === "QUEUED") return "sending";
  if (fresh && r.status === "DISPLAYED") return "notified";     // only after the nurse screen's receipt
  if (fresh && r.status === "ACKNOWLEDGED") return "acked";
  if (fresh && r.status === "CANCELLED") return "cancelled";
  return "ready";
}

function show(key, s) {
  const it = s && s.last && (s.intents || []).find(i => i.id === s.last.intent);
  const label = it ? it.label : (s && s.last && s.last.text || "").replace(/[.!?]+$/, "");
  if (key + label === current) return;
  const [face, vis, ask, head, sub, req, ctl, tone] = V[key];
  const apply = () => {
    $("face").dataset.mode = face;
    $("meter").hidden = vis !== "meter"; $("ok").hidden = vis !== "ok"; $("bad").hidden = vis !== "bad";
    $("ask").hidden = !ask;
    $("head").textContent = head; $("head").hidden = !head;
    $("sub").textContent = sub; $("sub").hidden = !sub;
    $("request").hidden = !req; $("hint").hidden = !req; $("controls").hidden = !ctl;
    if (req) {
      const icon = it && document.getElementById("i-" + it.id) ? `<svg aria-hidden="true" class="ico"><use href="#i-${it.id}"/></svg>` : "";
      $("request").innerHTML = icon + "<span></span>"; $("request").lastChild.textContent = label + "?";
    }
    $("stage").dataset.tone = tone || "";
  };
  if (current) { $("stage").classList.add("swap"); setTimeout(() => { apply(); $("stage").classList.remove("swap"); }, 200); } else apply();
  current = key + label;
}

function render(s) {
  last = s;
  const k = s.last && s.last.understood === false ? JSON.stringify(s.last) : "";
  if (k && k !== lastKey && s.state === "IDLE") retryUntil = Date.now() + 5000;
  lastKey = k;
  if (!demoBuilt && s.intents) {
    demoBuilt = true;
    for (const i of s.intents) { const b = document.createElement("button");
      b.className = "btn"; b.type = "button"; b.textContent = i.label; b.dataset.a = "select"; b.dataset.i = i.id; demo.append(b); }
  }
  show(pick(s), s);
}
setInterval(() => last && show(pick(last), last), 1000);

function setConn(on) {
  $("conn").dataset.state = on ? "on" : "off";
  $("connText").textContent = on ? "Connected" : "Disconnected";
  $("connIco").firstElementChild.setAttribute("href", on ? "#i-wifi" : "#i-wifi-off");
}
function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?role=room`);
  ws.onopen = () => setConn(true);
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === "room_state") render(m); };
  ws.onclose = () => { setConn(false); last = null; show("offline"); setTimeout(connect, 1500); };
}
connect();
document.addEventListener("visibilitychange", () =>
  document.getAnimations && document.getAnimations().forEach(a => document.hidden ? a.pause() : a.play()));
</script>
</body>
</html>
