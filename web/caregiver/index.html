<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F3">
<meta name="description" content="Sonara nurse worklist: patient requests from the bedside display, to acknowledge and resolve.">
<title>Sonara nurse list</title>
<link rel="preload" href="/static/shared/fonts/Inter.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/static/shared/base.css">
<style>
/* Hallmark · app screen · nurse worklist · v2 light (Inter, warm canvas), one accent: the room orb's orange marks what is new */
/* critique: a list a nurse reads in two seconds; bed, need, wait, one action. Tap a patient for their own page of requests. Status is always a word plus an icon. */
  :root { --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px; }
  html, body { overflow-x: clip; }
  body { min-height: 100vh; font-size: 16px; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 var(--space-4) calc(var(--space-6) + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 2; background: var(--canvas); padding: calc(var(--space-3) + env(safe-area-inset-top)) 0 var(--space-3);
    border-bottom: 1px solid var(--divider); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); font-size: 20px; }
  .tools { display: flex; gap: var(--space-2); align-items: center; }
  .logo .ico { width: 30px; height: 28px; stroke-width: 3; }
  /* connection: one black glyph like a phone's status bar (wifi, or wifi with a cross); the word is for screen readers */
  .conn, .conn.on, .conn:not(.on) { padding: 0 var(--space-1); background: none; color: var(--ink); }
  .conn .ico { width: 24px; height: 24px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .icon-btn { min-width: 44px; min-height: 44px; padding: 0 var(--space-3); border-radius: var(--radius-control);
    background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    transition: transform .1s ease, opacity .15s ease; touch-action: manipulation; }
  .icon-btn .ico { width: 20px; height: 20px; }
  /* alert sound: a bare black bell (crossed out when off), the tap target stays 44px */
  .icon-btn.bare { background: none; border: 0; padding: 0; color: var(--ink); }
  .icon-btn.bare .ico { width: 24px; height: 24px; }
  h1 { margin: var(--space-4) 0 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
  .count { margin: var(--space-1) 0 0; color: var(--ink-2); font-size: 15px; }
  .back { display: inline-flex; align-items: center; gap: var(--space-1); min-height: 44px; margin: var(--space-2) 0 0 calc(-1 * var(--space-2));
    padding: 0 var(--space-2); font-size: 15px; font-weight: 600; color: var(--ink); text-decoration: none; }
  .back .ico { width: 20px; height: 20px; stroke-width: 2.4; }
  .banner { margin: var(--space-3) 0 0; padding: var(--space-3) var(--space-4); border-radius: var(--radius-control); font-weight: 600; font-size: 15px;
    color: var(--rose-ink); background: var(--rose-wash); display: flex; gap: var(--space-2); align-items: flex-start; }
  .banner .ico { width: 20px; height: 20px; flex: none; stroke-width: 2.4; }

  .list { list-style: none; margin: var(--space-4) 0 0; padding: 0; display: grid; gap: var(--space-2); }
  .row { position: relative; background: var(--surface); border: 1px solid var(--divider); border-radius: var(--radius-card);
    padding: var(--space-4); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); align-items: center; }
  .row.new { border-color: var(--orange-line); }
  .row.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { opacity: .4; transform: translateY(-4px); } }
  /* the patient's name opens their page; the whole card is the tap target, the action button sits above it */
  .bed { justify-self: start; display: inline-flex; align-items: center; gap: var(--space-1); font-size: 21px; font-weight: 700;
    letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
  .bed::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .bed .ico { width: 18px; height: 18px; stroke-width: 2.4; color: var(--ink-2); }
  .row:has(.bed:active) { background: var(--canvas); }
  .what { font-size: 17px; font-weight: 500; color: var(--ink); min-width: 0; overflow-wrap: break-word; }
  .row.idle .what, .what.sub { color: var(--ink-2); }
  .what.sub { font-size: 15px; font-weight: 400; }
  .state { justify-self: start; display: inline-flex; align-items: center; gap: var(--space-1); font-size: 13px; font-weight: 600;
    padding: var(--space-1) var(--space-2); border-radius: var(--radius-control); background: var(--green-wash); color: var(--green-ink); }
  .state .ico { width: 14px; height: 14px; stroke-width: 2.6; }
  .state.new { background: var(--orange-wash); color: var(--orange-ink); }
  .wait { grid-column: 2; grid-row: 1; justify-self: end; font-size: 15px; color: var(--ink-2); }
  .act { position: relative; z-index: 1; grid-column: 2; grid-row: 2 / span 2; justify-self: end; min-height: 44px; padding: 0 var(--space-4);
    border-radius: var(--radius-control); font-size: 15px; font-weight: 600; transition: transform .1s ease, opacity .15s ease; touch-action: manipulation; }
  .act.primary { background: var(--ink); color: var(--on-ink); }
  .act.secondary { background: var(--surface); border: 1.5px solid var(--line); }
  .act:hover:not(:disabled), .icon-btn:hover { opacity: .88; }
  .act:active:not(:disabled), .icon-btn:active { transform: scale(.97); }
  .act:disabled { opacity: .5; cursor: progress; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .empty { color: var(--ink-2); padding: var(--space-4) var(--space-1); }

  /* patient page */
  h2 { margin: var(--space-8) 0 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .elsewhere { margin: var(--space-3) 0 0; }
  .elsewhere a { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-control); background: var(--orange-wash); color: var(--orange-ink); font-weight: 600; font-size: 15px; text-decoration: none; }
  .elsewhere .ico { width: 18px; height: 18px; flex: none; }
  .hlist { list-style: none; margin: var(--space-3) 0 0; padding: 0; border-top: 1px solid var(--divider); }
  .hrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); align-items: center;
    padding: var(--space-3) var(--space-1); border-bottom: 1px solid var(--divider); }
  .hwhat { font-size: 16px; font-weight: 600; min-width: 0; overflow-wrap: break-word; }
  .htime { grid-column: 1; font-size: 14px; color: var(--ink-2); }
  .hstate { grid-column: 2; grid-row: 1 / span 2; display: inline-flex; align-items: center; gap: var(--space-1); font-size: 13px; font-weight: 600;
    color: var(--green-ink); white-space: nowrap; }
  .hstate.off { color: var(--ink-2); }
  .hstate .ico { width: 14px; height: 14px; stroke-width: 2.6; }
  .hempty { padding: var(--space-3) var(--space-1); color: var(--ink-2); border-bottom: 1px solid var(--divider); }
  .foot { margin: var(--space-6) 0 var(--space-8); }

  @media (prefers-reduced-motion: reduce) {
    .row.flash { animation: none; }
    .act, .icon-btn { transition: none; }
  }
</style>
</head>
<body>
<svg hidden aria-hidden="true">
  <symbol id="i-mark" viewBox="0 0 42 40"><path d="M3 15v10M11 10v20M19 4v32M27 9v22M35 14v12"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9.5a14 14 0 0 1 19 0M5.8 13a9.3 9.3 0 0 1 12.4 0M9 16.4a4.6 4.6 0 0 1 6 0"/><circle cx="12" cy="19.6" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18M9 16.4a4.6 4.6 0 0 1 6 0M5.8 13a9.3 9.3 0 0 1 4-2.2M14.6 10.9a9.3 9.3 0 0 1 3.6 2.1M2.5 9.5a14 14 0 0 1 4.3-2.8M11 5.6a14 14 0 0 1 10.5 3.9"/><circle cx="12" cy="19.6" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0v4l-2 3h16l-2-3zM10 19a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19zM12 10v4.5M12 17.5v.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2L18.5 7.8"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-bell-off" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0v4l-2 3h16l-2-3zM10 19a2 2 0 0 0 4 0M3 3l18 18"/></symbol>
</svg>
<div class="wrap">
<header>
  <div class="top">
    <span class="logo"><svg class="ico" aria-hidden="true"><use href="#i-mark"/></svg>Sonara</span>
    <div class="tools">
      <span class="conn" id="conn"><svg class="ico" aria-hidden="true"><use href="#i-wifi-off" id="connIco"/></svg><span class="sr" id="connText">Connecting</span></span>
      <button class="icon-btn bare" id="sound" type="button" aria-pressed="false" aria-label="Alert sound off"><svg class="ico" aria-hidden="true"><use href="#i-bell-off" id="soundIco"/></svg></button>
    </div>
  </div>
  <a class="back" id="back" href="#" hidden><svg class="ico" aria-hidden="true"><use href="#i-prev"/></svg>All patients</a>
  <h1 id="title">Requests</h1>
  <p class="count tnum" id="count">Loading requests</p>
  <p class="banner" id="banner" hidden><svg class="ico" aria-hidden="true"><use href="#i-alert"/></svg><span id="bannerText">Disconnected from the bedside device. New requests cannot reach this screen.</span></p>
</header>

<!-- all patients -->
<main id="listView">
  <ul class="list" id="list" aria-live="polite"></ul>
</main>

<!-- one patient: opened by tapping a patient, /caregiver#bed=<id> -->
<main id="bedView" hidden>
  <div class="elsewhere" id="elsewhere" aria-live="polite"></div>
  <ul class="list" id="bedActive" aria-live="polite"></ul>
  <h2>Earlier requests</h2>
  <ul class="hlist" id="bedHistory"></ul>
</main>

<p class="foot"><button class="icon-btn" id="tokenBtn" type="button">Change caregiver token</button></p>
</div>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem("sonara_token") || "";
const askToken = () => { const t = prompt("Caregiver access token", token); if (t !== null) { token = t; localStorage.setItem("sonara_token", t); location.reload(); } };
$("tokenBtn").onclick = askToken;
if (!token) askToken();

const ACTIVE = ["QUEUED", "DISPLAYED", "NOT_DISPLAYED", "ACKNOWLEDGED"];
const LABEL = { QUEUED: "New", DISPLAYED: "New", NOT_DISPLAYED: "New", ACKNOWLEDGED: "Acknowledged",
                COMPLETED: "Resolved", CANCELLED: "Cancelled by patient" };
const reqs = new Map(), receipted = new Set(), flashed = new Set(), busy = new Set();
let ws, beds = new Set(), pressing = false, dirty = false;

// ---- alert sound: a real on/off toggle. Browsers only allow audio after a tap, so the
// preference is remembered and the sound is unlocked again on the first tap after a reload.
let audioCtx = null, soundOn = false;
const AC = window.AudioContext || window.webkitAudioContext;
function unlockAudio() {
  if (!AC) return false;
  try { audioCtx = audioCtx || new AC(); if (audioCtx.state !== "running") audioCtx.resume(); return true; } catch { return false; }
}
function setSound(on) {
  soundOn = on;
  $("soundIco").setAttribute("href", on ? "#i-bell" : "#i-bell-off");
  $("sound").setAttribute("aria-pressed", String(on));
  $("sound").setAttribute("aria-label", on ? "Alert sound on" : "Alert sound off");
  try { localStorage.setItem("sonara_sound", on ? "1" : "0"); } catch {}
}
$("sound").addEventListener("click", () => {
  if (soundOn) { setSound(false); return; }
  setSound(unlockAudio());
  beep();                                    // test beep so the nurse hears it works
});
let wantSound = false;
try { wantSound = localStorage.getItem("sonara_sound") === "1"; } catch {}
if (wantSound) {
  setSound(true);
  addEventListener("pointerdown", function once(e) {
    if (e.target.closest("#sound")) return;  // the bell handles its own tap
    unlockAudio(); removeEventListener("pointerdown", once);
  });
}
function beep() {
  if (!soundOn || !audioCtx) return;
  if (audioCtx.state !== "running") audioCtx.resume();
  [0, .25].forEach(t => { const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(.2, audioCtx.currentTime + t);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + t + .2);
    o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .2); });
}

const wait = iso => { const m = Math.max(0, (Date.now() - Date.parse(iso)) / 60000 | 0); return m < 1 ? "<1 min" : m < 60 ? `${m} min` : `${m / 60 | 0} h ${m % 60} min`; };
const when = iso => { const d = new Date(iso), t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === new Date().toDateString() ? `Today, ${t}` : `${d.toLocaleDateString([], { day: "numeric", month: "short" })}, ${t}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bedHref = b => "#bed=" + encodeURIComponent(b);
const openBed = () => location.hash.startsWith("#bed=") ? decodeURIComponent(location.hash.slice(5)) : null;

// ids: one request, or every request in a grouped card ("a,b,c")
async function act(ids, what, btn) {
  ids = ids.split(","); ids.forEach(id => busy.add(id)); btn.disabled = true;
  try {   // UI changes only when the server's broadcast confirms the new status
    const res = await Promise.all(ids.map(id =>
      fetch(`/api/requests/${id}/${what}`, { method: "POST", headers: { "X-Sonara-Token": token } }).catch(() => null)));
    if (res.some(r => r && r.status === 401)) askToken();
  } finally { ids.forEach(id => busy.delete(id)); render(); }
}

// Don't reorder rows under a nurse's finger (a scroll ends in pointercancel, not pointerup)
addEventListener("pointerdown", e => { if (e.target.closest(".list")) pressing = true; });
const release = () => { pressing = false; if (dirty) render(); };
addEventListener("pointerup", release);
addEventListener("pointercancel", release);

function card(r, onBedPage) {   // on the patient page the card leads with the need, not the (repeated) bed
  const ack = r.status === "ACKNOWLEDGED";
  return `<li class="row ${ack ? "ack" : "new"} ${flashed.has(r.request_id) ? "" : "flash"}">
    ${onBedPage ? `<span class="bed">${esc(r.label)}</span>`
      : `<a class="bed tnum" href="${bedHref(r.bed_id)}">${esc(r.bed_id)}<svg class="ico" aria-hidden="true"><use href="#i-next"/></svg></a>`}
    <span class="wait tnum" data-since="${r.created_at}">${wait(r.created_at)}</span>
    <span class="what${onBedPage ? " sub" : ""}">${onBedPage ? when(r.created_at) : esc(r.label)}</span>
    <span class="state ${ack ? "" : "new"}"><svg class="ico" aria-hidden="true"><use href="#i-${ack ? "check" : "bell"}"/></svg>${ack ? "Acknowledged" : "New"}</span>
    <button class="act ${ack ? "secondary" : "primary"}" type="button" data-id="${r.request_id}" data-do="${ack ? "complete" : "acknowledge"}"
      ${busy.has(r.request_id) ? "disabled" : ""}>${ack ? "Resolve" : "Acknowledge"}</button></li>`;
}
const byUrgency = (a, b) => (a.status === "ACKNOWLEDGED") - (b.status === "ACKNOWLEDGED") || a.created_at.localeCompare(b.created_at);

// A bed that asks several times in a short span gets one card: each request within SPAN of the
// previous one from that bed joins its group. The patient page still lists them one by one.
const SPAN = 5 * 60000;
function groupByBed(list) {
  const groups = [], lastOf = new Map();
  for (const r of [...list].sort((a, b) => a.created_at.localeCompare(b.created_at))) {
    const g = lastOf.get(r.bed_id);
    if (g && Date.parse(r.created_at) - Date.parse(g.items[g.items.length - 1].created_at) <= SPAN) g.items.push(r);
    else { const n = { bed: r.bed_id, items: [r] }; groups.push(n); lastOf.set(r.bed_id, n); }
  }
  const fresh = g => g.items.some(r => r.status !== "ACKNOWLEDGED");
  return groups.sort((a, b) => fresh(b) - fresh(a) || a.items[0].created_at.localeCompare(b.items[0].created_at));
}
function groupCard(g) {
  if (g.items.length === 1) return card(g.items[0]);
  const fresh = g.items.filter(r => r.status !== "ACKNOWLEDGED"), ack = !fresh.length;
  const targets = ack ? g.items : fresh;            // acknowledge the new ones first, then resolve all
  const counts = new Map();
  g.items.forEach(r => counts.set(r.label, (counts.get(r.label) || 0) + 1));
  const what = [...counts].map(([l, n]) => n > 1 ? `${esc(l)} ×${n}` : esc(l)).join(", ");
  return `<li class="row ${ack ? "ack" : "new"} ${g.items.some(r => !flashed.has(r.request_id)) ? "flash" : ""}">
    <a class="bed tnum" href="${bedHref(g.bed)}">${esc(g.bed)}<svg class="ico" aria-hidden="true"><use href="#i-next"/></svg></a>
    <span class="wait tnum" data-since="${g.items[0].created_at}">${wait(g.items[0].created_at)}</span>
    <span class="what">${what}</span>
    <span class="state ${ack ? "" : "new"}"><svg class="ico" aria-hidden="true"><use href="#i-${ack ? "check" : "bell"}"/></svg>${ack ? `${g.items.length} acknowledged` : fresh.length === g.items.length ? `${fresh.length} new` : `${fresh.length} new of ${g.items.length}`}</span>
    <button class="act ${ack ? "secondary" : "primary"}" type="button" data-id="${targets.map(r => r.request_id).join(",")}" data-do="${ack ? "complete" : "acknowledge"}"
      ${targets.some(r => busy.has(r.request_id)) ? "disabled" : ""}>${ack ? "Resolve all" : "Acknowledge all"}</button></li>`;
}

let shown = new Set();   // request ids actually rendered right now (receipts only for these)
function render() {
  if (pressing) { dirty = true; return; } dirty = false;
  const all = [...reqs.values()], bed = openBed();
  const active = all.filter(r => ACTIVE.includes(r.status)).sort(byUrgency);
  shown = new Set();
  $("listView").hidden = !!bed; $("bedView").hidden = !bed; $("back").hidden = !bed;

  if (!bed) {
    const busyBeds = new Set(active.map(r => r.bed_id));
    const idle = [...beds].filter(b => !busyBeds.has(b)).sort();
    const n = active.filter(r => r.status !== "ACKNOWLEDGED").length;
    $("title").textContent = "Requests";
    $("count").textContent = `${active.length} active, ${n} new`;
    $("list").innerHTML = groupByBed(active).map(groupCard).join("") + idle.map(b => `<li class="row idle">
        <a class="bed tnum" href="${bedHref(b)}">${esc(b)}<svg class="ico" aria-hidden="true"><use href="#i-next"/></svg></a>
        <span class="what">No active request</span></li>`).join("")
      || '<li class="empty">No active requests.</li>';
    active.forEach(r => shown.add(r.request_id));
  } else {
    const mine = all.filter(r => r.bed_id === bed);
    const open = active.filter(r => r.bed_id === bed);
    const past = mine.filter(r => !ACTIVE.includes(r.status)).sort((a, b) => b.created_at.localeCompare(a.created_at));
    const others = active.filter(r => r.bed_id !== bed && r.status !== "ACKNOWLEDGED");
    $("title").textContent = bed;
    $("count").textContent = `${open.length} active, ${past.length} earlier`;
    // a new request from another patient is never hidden behind this page
    $("elsewhere").innerHTML = others.map(r => `<a href="${bedHref(r.bed_id)}"><svg class="ico" aria-hidden="true"><use href="#i-bell"/></svg>
        New from ${esc(r.bed_id)}: ${esc(r.label)}</a>`).join("");
    $("bedActive").innerHTML = open.map(r => card(r, true)).join("") || '<li class="empty">No active request.</li>';
    $("bedHistory").innerHTML = past.map(r => { const done = r.status === "COMPLETED";
      return `<li class="hrow"><span class="hwhat">${esc(r.label)}</span>
        <span class="htime tnum">${when(r.created_at)}</span>
        <span class="hstate ${done ? "" : "off"}"><svg class="ico" aria-hidden="true"><use href="#i-${done ? "check" : "x"}"/></svg>${LABEL[r.status] || esc(r.status)}</span></li>`;
    }).join("") || '<li class="hempty">No earlier requests.</li>';
    [...open, ...others].forEach(r => shown.add(r.request_id));
  }
  active.forEach(r => flashed.add(r.request_id));
  receiptVisible();
}
document.addEventListener("click", e => { const b = e.target.closest("button.act"); if (b) act(b.dataset.id, b.dataset.do, b); });
addEventListener("hashchange", () => { scrollTo(0, 0); if (openBed()) loadHistory(); render(); });

// The live feed only carries the latest 20 finished requests; a patient page loads up to 50 more
function loadHistory() {
  fetch("/api/requests").then(r => r.json()).then(list => {
    for (const r of list) if (!reqs.has(r.request_id)) reqs.set(r.request_id, r);
    render();
  }).catch(() => {});
}

// Tell the device a request is actually on screen (sets DISPLAYED, never ACKNOWLEDGED)
function receiptVisible() {
  if (!ws || ws.readyState !== 1 || document.hidden) return;
  for (const r of reqs.values())
    if (shown.has(r.request_id) && (r.status === "QUEUED" || r.status === "NOT_DISPLAYED") && !receipted.has(r.request_id + r.status)) {
      receipted.add(r.request_id + r.status);
      ws.send(JSON.stringify({ type: "receipt", request_id: r.request_id }));
    }
}
document.addEventListener("visibilitychange", receiptVisible);
setInterval(() => document.querySelectorAll("[data-since]").forEach(e => e.textContent = wait(e.dataset.since)), 15000);

fetch("/api/health").then(r => r.json()).then(h => { if (h.bed_id) { beds.add(h.bed_id); render(); } }).catch(() => {});
if (openBed()) loadHistory();

function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?role=caregiver&token=${encodeURIComponent(token)}`);
  ws.onopen = () => { $("connText").textContent = "Connected"; $("conn").classList.add("on"); $("connIco").setAttribute("href", "#i-wifi"); $("banner").hidden = true; receipted.clear(); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "snapshot") { reqs.clear(); [...m.history, ...m.active].forEach(r => { reqs.set(r.request_id, r); flashed.add(r.request_id); });
      if (openBed()) loadHistory(); }
    if (m.type === "request") {
      const isNew = !reqs.has(m.request.request_id) && m.request.status === "QUEUED";
      reqs.set(m.request.request_id, m.request);
      if (isNew) { beep(); document.title = `New request: ${m.request.bed_id}`; }
    }
    for (const r of reqs.values()) beds.add(r.bed_id);
    render();
  };
  ws.onclose = e => {
    $("connText").textContent = "Disconnected"; $("conn").classList.remove("on"); $("connIco").setAttribute("href", "#i-wifi-off"); $("banner").hidden = false;
    if (e.code === 4401) { $("bannerText").textContent = "Wrong caregiver token. Use Change caregiver token below."; return; }
    setTimeout(connect, 1500);
  };
}
render();
connect();
</script>
</body>
</html>
