# Sonara runtime configuration. Paths are relative to the repo root.

bed_id = "BED-01"

[audio]
sample_rate = 16000
device = ""                 # default PortAudio device, or "alsa:plughw:CARD=Set,DEV=0" on UNO Q
block_ms = 30
max_utterance_s = 5.0
silence_end_ms = 1200        # stop recording after this much trailing silence
speech_start_factor = 3.0   # speech when RMS > noise_floor * factor
min_speech_ms = 200
min_rms = 0.00003
trim_factor = 2.0
trim_pad_ms = 180
manual_duration_s = 0       # 0 = VAD; set 0.3–5 for fixed Talk recording boundaries
listen_mode = "push_to_talk" # "push_to_talk" | "always_on" (VAD-gated)
push_to_talk_wait_s = 4.0    # how long to wait for speech after Talk is pressed

[recognition]
profile_dir = "data/profiles"
profile_id = "patient_001"
band = 0.2                 # fraction of the longer sequence; 0 means narrowest feasible path
margin = 0.12              # minimum runner-up distance minus best distance
# threshold = 0.6          # optional stricter absolute cap; zero rejects everything

[features]
sample_rate = 16000
window_length_ms = 25
hop_length_ms = 10
n_fft = 512
n_mels = 40
n_mfcc = 13
pre_emphasis = 0.97
normalization = "cmvn"
variance_floor = 0.01

[tts]
voice_model = "models/en_US-lessac-medium.onnx"
prompt_dir = "assets/tts"
allow_live_synthesis = false   # true = synthesise missing prompts at runtime with Piper

[flow]
confirm_timeout_s = 15     # pending remote request auto-cancels (never auto-sends)

[server]
host = "0.0.0.0"
port = 8000
caregiver_token = "change-me-before-demo"
db_path = "data/sonara.db"
display_timeout_s = 10     # no caregiver receipt within this → NOT_DISPLAYED

[hardware]
mcu = "keyboard"           # "keyboard" (laptop dev) | "unoq" (Arduino Bridge) | "none"

[push]
enabled = false            # optional internet-enabled Web Push; configure only in data/local.toml
private_key = "data/webpush-private.pem"
subject = ""               # real contact mailto: address or HTTPS contact URL required when enabled
