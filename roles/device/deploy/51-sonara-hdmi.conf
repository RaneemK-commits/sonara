# WirePlumber 0.5: always use the HDMI profile of the UNO Q sound card, so audio goes
# DisplayPort -> display -> display's 3.5 mm jack -> speaker. Without this, WirePlumber
# picks "HiFi" (headphone/lineout only) after every reboot.
# Install: mkdir -p ~/.config/wireplumber/wireplumber.conf.d && cp this file there,
#          then systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = { update-props = { device.profile = "HDMI" } }
  }
]
